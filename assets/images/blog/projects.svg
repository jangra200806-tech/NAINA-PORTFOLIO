    <circle cx="236" cy="278" r="6" fill="#A78BCE"/><circle cx="258" cy="278" r="6" fill="#D9C9EB"/><circle cx="280" cy="278" r="6" fill="#39394A"/>
    <rect x="238" y="342" width="230" height="16" rx="8" fill="#D9C9EB" fill-opacity="0.55"/>
