    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BCE"/>
      <stop offset="1" stop-color="#D9C9EB"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A78BCE" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#A78BCE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0v54" fill="none" stroke="#A78BCE" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
