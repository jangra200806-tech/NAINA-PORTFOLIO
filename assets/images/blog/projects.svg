    <path d="M455 326h560" stroke="#D9C9EB" stroke-opacity="0.16"/>
    <circle cx="491" cy="298" r="6" fill="#A78BCE"/><circle cx="513" cy="298" r="6" fill="#D9C9EB"/><circle cx="535" cy="298" r="6" fill="#39394A"/>
    <rect x="496" y="360" width="180" height="14" rx="7" fill="#A78BCE" fill-opacity="0.6"/>
    <rect x="496" y="394" width="290" height="9" rx="4" fill="#B8B5C2" fill-opacity="0.17"/>
    <rect x="496" y="416" width="230" height="9" rx="4" fill="#B8B5C2" fill-opacity="0.12"/>
    <rect x="496" y="458" width="116" height="34" rx="17" fill="#D9C9EB" fill-opacity="0.16" stroke="#D9C9EB" stroke-opacity="0.36"/>
