    <rect x="238" y="400" width="260" height="9" rx="4" fill="#B8B5C2" fill-opacity="0.13"/>
    <rect x="238" y="442" width="108" height="34" rx="17" fill="url(#line)" fill-opacity="0.7"/>
    <circle cx="638" cy="470" r="74" fill="#D9C9EB" fill-opacity="0.13" stroke="#D9C9EB" stroke-opacity="0.3"/>
  </g>

  <g transform="rotate(7 750 430)">
