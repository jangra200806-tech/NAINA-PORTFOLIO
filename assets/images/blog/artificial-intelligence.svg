<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Abstract artificial intelligence network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B1A"/>
      <stop offset="1" stop-color="#10152B"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="0.22" stop-color="#38BDF8"/>
      <stop offset="0.58" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0v54" fill="none" stroke="#38BDF8" stroke-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <circle cx="600" cy="375" r="350" fill="url(#halo)"/>

  <g stroke="url(#line)" stroke-opacity="0.45">
    <path d="M600 375 290 215"/><path d="M600 375 900 205"/>
    <path d="M600 375 230 470"/><path d="M600 375 970 490"/>
    <path d="M600 375 420 655"/><path d="M600 375 785 650"/>
    <path d="M290 215 900 205"/><path d="M230 470 420 655"/>
    <path d="M970 490 785 650"/>
  </g>

  <g fill="#0B1020" stroke="#38BDF8" stroke-width="2">
    <circle cx="290" cy="215" r="24"/><circle cx="900" cy="205" r="18"/>
    <circle cx="230" cy="470" r="20"/><circle cx="970" cy="490" r="26"/>
    <circle cx="420" cy="655" r="18"/><circle cx="785" cy="650" r="22"/>
  </g>
  <g fill="#8B5CF6">
    <circle cx="290" cy="215" r="7"/><circle cx="900" cy="205" r="6"/>
    <circle cx="230" cy="470" r="6"/><circle cx="970" cy="490" r="8"/>
    <circle cx="420" cy="655" r="6"/><circle cx="785" cy="650" r="7"/>
  </g>

  <circle cx="600" cy="375" r="130" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="600" cy="375" r="172" fill="none" stroke="#38BDF8" stroke-opacity="0.38" stroke-dasharray="3 13"/>
  <circle cx="600" cy="375" r="228" fill="none" stroke="#8B5CF6" stroke-opacity="0.22"/>
  <circle cx="600" cy="375" r="286" fill="none" stroke="#8B5CF6" stroke-opacity="0.12"/>

  <text x="600" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="94" font-weight="300" letter-spacing="8" fill="#F8FAFC" fill-opacity="0.92">AI</text>
  <text x="600" y="640" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="6" fill="#A1A1AA" fill-opacity="0.65">PROMPTS · MODELS · IDEAS</text>
  <circle cx="765" cy="245" r="4" fill="#38BDF8"/>
  <circle cx="350" cy="565" r="3" fill="#A78BFA"/>
</svg>
